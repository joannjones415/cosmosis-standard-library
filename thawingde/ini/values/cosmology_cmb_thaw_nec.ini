; Cosmological parameter block for CMB-mode thawing DE runs.
; Unlike external-probe runs (which fix n_s, A_s, tau to Planck best-fit),
; CMB runs must vary these parameters because the CMB data constrains them.
;
; Ranges follow:
;   - h0, omega_m, omega_b: broad priors consistent with DES Y6 3x2pt block
;   - n_s, A_s_1e9, tau: standard Planck-era priors
;   - w, wa: thawing model NEC prior (same as all thawingde runs)
;   - mnu: fixed at minimum mass 0.06 eV (Shajib convention)
[cosmological_parameters]
h0      = 0.58  0.68  0.80
omega_m = 0.10  0.31  0.60
omega_b = 0.03  0.049 0.07
n_s     = 0.93  0.965 1.00
A_s_1e9 = 0.5   2.1   5.0
; In thaw_camb: w = w0, wa = alpha (scalar field shape parameter)
w       = -1.0  -0.50  -0.33
wa      = 1.35  1.45  1.55
tau     = 0.01  0.054 0.8
omega_k = 0.0
yhe     = 0.245341
standard_neutrino_neff = 3.044
num_massive_neutrinos  = 3
nnu     = 3.044
mnu     = 0.06 0.0773062 0.6
k_s     = 0.05
n_run   = 0.0
r_t     = 0.0
n_t     = 0.0
