; ΛCDM cosmology block for background-only (external) runs.
; Identical to cosmology_external_thaw_nec.ini except w = -1 (fixed)
; and wa is fixed to the prior midpoint.
; With w = -1 fixed, thaw_camb/camb_bg reproduces exact ΛCDM.
[cosmological_parameters]
h0      = 0.58 0.70 0.80
omega_m = 0.10 0.30 0.60
w       = -1.0
wa      = 1.45
omega_b = 0.03 0.051 0.07
omega_k = 0.0
n_s     = 0.97
A_s_1e9 = 2.19
mnu     = 0.06 0.0773062 0.6
standard_neutrino_neff = 3.046
nnu     = 3.046
num_massive_neutrinos  = 3
tau     = 0.054
yhe     = 0.245341
k_s     = 0.05
n_run   = 0.0
r_t     = 0.0
n_t     = 0.0
