; 3x2-containing runs use the Y6 cosmology box as the numerical baseline and
; swap in only the thawing-model w/wa block.
; - w0, a philosophy from the Shajib paper Table I
; - h0, omega_m, omega_b, n_s, A_s_1e9, mnu bounds from the Y6 3x2 defaults:
;   y6-3x2pt/inference/run_ini/values_v1.ini
; - tau is varied here using the same range used in the Y5 paper-style runs.
; The broader Shajib-style box was causing hacked-CAMB transfer crashes in 3x2 runs.
[cosmological_parameters]
h0 = 0.58 0.69 0.80
omega_m = 0.1 0.31 0.6
omega_b = 0.03 0.051 0.07
n_s = 0.93 0.965 1.00
; Y6 values_v1.ini uses lowercase a_s_1e9; here we use capital A_s_1e9
; because the local consistency code converts that spelling explicitly.
A_s_1e9 = 0.5 1.831 5.0
w = -1.0 -0.50 -0.33
wa = 1.35 1.45 1.55
omega_k = 0.0
tau = 0.054
yhe = 0.245341
standard_neutrino_neff = 3.044
num_massive_neutrinos = 3
nnu = 3.044
mnu = 0.06 0.0773062 0.6
