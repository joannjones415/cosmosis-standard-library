; Background-only runs follow the paper and fix the non-geometric parameters.
; Sources:
; - Prior ranges for h, omega_m, w0, a:
;   Shajib text Table I and lines 357-366
; - Paper notes that for non-LSS/non-CMB probes, omega_b, n_s, A_s, mnu
;   are fixed to Planck best-fit values:
;   Shajib text Table I note, lines 357-390
; - Numerical Planck-like fixed values:
;   cosmosis-standard-library/examples/planck_values.ini
[cosmological_parameters]
h0 = 0.58 0.70 0.80
omega_m = 0.10 0.30 0.60
; In the hacked CAMB, "w" is the paper's w0 parameter.
w = -1.0 -0.50 -0.33
; In the hacked CAMB, "wa" is the paper's a parameter, with flat prior U(1.35,1.55).
wa = 1.35 1.45 1.55
omega_b = 0.03 0.051 0.07
omega_k = 0.0
n_s = 0.97
; Use capital A_s_1e9 because this local consistency module explicitly
; converts A_s_1e9 -> A_s, unlike the lowercase Y6 spelling.
A_s_1e9 = 2.19
mnu = 0.06 0.0773062 0.6
standard_neutrino_neff = 3.046
nnu = 3.046
num_massive_neutrinos = 3
tau = 0.054
yhe = 0.245341
k_s = 0.05
n_run = 0.0
r_t = 0.0
n_t = 0.0
