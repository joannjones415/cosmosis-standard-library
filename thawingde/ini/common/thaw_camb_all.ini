; CAMB settings for joint 3x2pt + CMB runs.
; mode=all computes both CMB spectra (for Planck/ACT) and matter power
; spectrum (for 3x2pt weak lensing).  Combines thaw_camb_power.ini and
; thaw_camb_cmb.ini into one block.
[camb]
file = boltzmann/camb/camb_interface.py
mode = all
lmax = 4000
lens_margin = 1250
lens_potential_accuracy = 4
feedback = 0
AccuracyBoost = 1.1
lSampleBoost = 1.0
lAccuracyBoost = 1.0
do_tensors = F
do_lensing = T
NonLinear = both
halofit_version = mead2020_feedback
use_tabulated_w = F
use_ppf_w = F
do_reionization = T
use_optical_depth = T
accurate_massive_neutrino_transfers = T
nz_background = 401
zmin_background = 0.0
zmax_background = 4.0
want_chistar = T
n_logz = 100
zmax_logz = 1100.0
kmax = 50.0
kmax_extrapolate = 500.0
nk = 700
