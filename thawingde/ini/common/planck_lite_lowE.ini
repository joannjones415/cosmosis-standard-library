; Planck 2018 plik_lite + low-ell TT (Commander) + low-ell EE (SimAll).
; This is the standard TT+TE+EE+lowE combination used by Shajib+Frieman (2025).
; PLANCK_PATH must be set in the [DEFAULT] section of the calling INI.
[planck_lite]
file = likelihood/planck2018/planck_interface.so
; plik_lite high-ell TT+TE+EE
data_1 = %(PLANCK_PATH)s/hi_l/plik_lite/plik_lite_v22_TTTEEE.clik
; low-ell TT (Commander)
data_2 = %(PLANCK_PATH)s/low_l/commander/commander_dx12_v3_2_29.clik
; low-ell EE (SimAll) — constrains tau
data_3 = %(PLANCK_PATH)s/low_l/simall/simall_100x143_offlike5_EE_Aplanck_B.clik
