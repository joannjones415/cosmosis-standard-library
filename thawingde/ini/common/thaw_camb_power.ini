; Override the standard Y6 [camb] block for the hacked thawing model.
; Sources:
; - base structure comes from y6-3x2pt/inference/run_ini/main_32pt.ini
; - halofit choice comes from axionde/inis/camb.ini, which already notes
;   that mead2020 is the intended halofit for the thawing model.

[camb]
use_tabulated_w = F
use_ppf_w = F
; Keep hacked CAMB on the standard thermal/reionization path.
do_reionization = T
want_chistar = T
use_optical_depth = T
halofit_version = mead2020_feedback
feedback = 0
