[runtime]
; Sampler block follows the modern Y6 convention in
; y6-3x2pt/inference/run_ini/main_32pt.ini and main_bao-sn.ini:
;   sampler = nautilus
;   n_live = 10000
;   discard_exploration = T
;   n_batch = ${N_BATCH}
;   n_networks = 16
;   n_jobs = ${N_JOBS}
sampler = nautilus
; Use the actual cluster checkout root rather than relying on cwd.
root = %(CSL_DIR)s
verbosity = quiet

[output]
filename = %(OUTPUT_DIR)s/%(RUN_NAME)s.txt
format = text
lock = F
privacy = F

[test]
save_dir = %(OUTPUT_DIR)s/test_%(RUN_NAME)s

[nautilus]
resume = T
n_live = 10000
n_eff = 1000
discard_exploration = T
n_batch = ${N_BATCH}
n_networks = 16
n_jobs = ${N_JOBS}
