; CAMB settings for CMB-mode thawing DE runs including ACT DR6.
; ACT DR6 lite uses ell 600-6500 with theory required to lmax~8500.
; lmax=9000 gives safe headroom.
; Source: axionde(new)/inis/camb.ini [camb_cmb] + ACT DR6 requirements.
[camb]
file = boltzmann/camb/camb_interface.py
mode = cmb
lmax = 9000
lens_margin = 1250
lens_potential_accuracy = 4
feedback = 0
AccuracyBoost = 1.1
lSampleBoost = 1.0
lAccuracyBoost = 1.0
do_tensors = F
do_lensing = T
NonLinear = lens
halofit_version = mead2020
use_tabulated_w = F
use_ppf_w = F
do_reionization = T
use_optical_depth = T
accurate_massive_neutrino_transfers = T
nz_background = 301
zmin_background = 0.0
zmax_background = 3.0
want_chistar = T
n_logz = 100
zmax_logz = 1100.0
