; Planck 2018 (py lite, ell cuts) + SimAll low-ell EE + ACT DR6 lite + SPT-3G DR1 lite.
; Mirrors the y6-3x2pt/inference/run_ini/main_cmb.ini CMB combination used by DES Y6.
; Planck ell cuts (TT<=1000, TE/EE<=600) avoid double-counting with ACT/SPT at high-ell.
; PLANCK_PATH must be set in the calling INI's [DEFAULT] (for SimAll .clik file).
; Use thaw_camb_cmb_act.ini (lmax=9000) with this file.

[planck_highell]
file = likelihood/planck_py/planck_py_interface.py
year = 2018
spectra = TTTEEE
use_low_ell_bins = T
ell_max_tt = 1000
ell_max_te = 600
ell_max_ee = 600

[planck_lowE]
file = likelihood/planck2018/planck_interface.so
data_1 = %(PLANCK_PATH)s/low_l/simall/simall_100x143_offlike5_EE_Aplanck_B.clik

[act_dr6_lite]
file = likelihood/act-dr6-lite/act_dr6_lite_interface.py

[spt_3g_dr1]
file = likelihood/candl/candl_cosmosis_interface.py
; SPT-3G DR1 TnE (spt_candl_data) unavailable on this cluster — using 2018 lite as substitute.
; Nuisance parameters (Tcal, Ecal) are identical; w0 impact is negligible.
data_set = candl_data.SPT3G_2018_TTTEEE_lite
variant = lite
lensing = F
likelihood_only = T
