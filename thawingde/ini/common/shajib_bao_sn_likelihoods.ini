; Shajib & Frieman (2025) [arXiv:2502.06929] BAO + SN likelihood combination.
;
; BAO: MGS (z=0.15) + BOSS DR12 (z=0.38, 0.51, 0.61) + DESI DR1 high-z
;      (LRG2/LRG3+ELG1/ELG2/QSO/Lya QSO at z=0.71–2.33)
; SN:  DES-SN5YR (Vincenzi et al. 2024); M marginalized analytically.
;
; Shajib uses SDSS for z < 0.6 (MGS z=0.15, BOSS DR12 z=0.38/0.51) and
; DESI DR1 for z > 0.6.  We include BOSS DR12's third bin at z=0.61 as well
; (small approximation; BOSS has higher precision than DESI DR1 at z≈0.6).
; DESI DR1 BGS (z=0.295) and LRG1 (z=0.51) are excluded to avoid
; double-counting with BOSS DR12.

[consistency]
file = utility/consistency/consistency_interface.py

[bbn_consistency]
file = utility/bbn_consistency/bbn_consistency.py

[camb_bg]
file = boltzmann/camb/camb_interface.py
mode = background
nz_background = 500
zmin_background = 0.0
zmax_background = 3.0
feedback = 0
use_tabulated_w = F
use_ppf_w = F
do_reionization = T
want_chistar = T
use_optical_depth = T

[mgs_bao]
file = likelihood/mgs_bao/mgs_bao.py

[boss_dr12]
; BOSS DR12 final consensus (Alam et al. 2016): z=0.38, 0.51, 0.61.
; mode=0 = BAO-only (DM, DH), not full-shape.
file = likelihood/boss_dr12/boss_dr12.py
mode = 0

[desi_dr1_hiz]
; DESI Year 1 (arXiv:2404.03002), high-z tracers only (z > 0.7).
; BGS (z=0.295) and LRG1 (z=0.51) excluded to avoid overlap with BOSS DR12.
file = likelihood/bao/desi1-dr1/desi1_dr1.py
desi_data_sets = LRG2, LRG3+ELG1, ELG2, QSO, Lya QSO

[des_sn5yr]
; DES 5-year photometric SN Ia (Vincenzi et al. 2024 / Sanchez et al. 2024).
; M is marginalized analytically — no [supernova_params] block needed.
; Default files: DES-SN5YR_HD.csv (1635 SNe) + STAT+SYS.txt.gz.
file = likelihood/desy5sn/desy5sn.py
