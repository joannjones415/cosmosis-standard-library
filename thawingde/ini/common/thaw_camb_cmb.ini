; CAMB settings for CMB-mode thawing DE runs (Planck-scale).
; lmax=4000 is sufficient for plik_lite (goes to ~2500) with lensing headroom.
; Source: axionde(new)/inis/camb.ini [camb_cmb], adapted for thaw_camb.
;
; Key difference from axionde: use_tabulated_w = F because thaw_camb
; encodes the thawing w(a) = -1 + (1+w0)*exp(-alpha*(1/a-1)) internally
; in the Fortran code; no w(a) table is needed.
[camb]
file = boltzmann/camb/camb_interface.py
mode = cmb
lmax = 4000
lens_margin = 1250
lens_potential_accuracy = 4
feedback = 0
AccuracyBoost = 1.1
lSampleBoost = 1.0
lAccuracyBoost = 1.0
do_tensors = F
do_lensing = T
NonLinear = lens
halofit_version = mead2020
use_tabulated_w = F
use_ppf_w = F
do_reionization = T
use_optical_depth = T
accurate_massive_neutrino_transfers = T
nz_background = 301
zmin_background = 0.0
zmax_background = 3.0
want_chistar = T
n_logz = 100
zmax_logz = 1100.0
