; Planck 2018 plik_lite + low-ell TT only — WITHOUT low-ell EE.
; tau is not constrained by data in this configuration; use a Gaussian
; tau prior from cmb_tau_prior.ini when running without low-ell EE.
; Intended for the extended-tau study context.
[planck_lite]
file = likelihood/planck2018/planck_interface.so
; plik_lite high-ell TT+TE+EE
data_1 = %(PLANCK_PATH)s/hi_l/plik_lite/plik_lite_v22_TTTEEE.clik
; low-ell TT (Commander)
data_2 = %(PLANCK_PATH)s/low_l/commander/commander_dx12_v3_2_29.clik
; no data_3: low-ell EE deliberately excluded
