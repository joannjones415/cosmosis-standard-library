; Shared external-data likelihood blocks.
; Sources:
; - consistency + bbn_consistency:
;   y6-3x2pt/inference/run_ini/main_bao-sn.ini
; - DES Y6 BAO block:
;   y6-3x2pt/inference/run_ini/main_bao-sn.ini [des_y6bao]
; - updated Dovekie SN block:
;   y6-3x2pt/inference/run_ini/main_bao-sn.ini [dovekie-sn]

[consistency]
file = utility/consistency/consistency_interface.py

[bbn_consistency]
file = utility/bbn_consistency/bbn_consistency.py

[camb_bg]
file = boltzmann/camb/camb_interface.py
mode = background
nz_background = 500
zmin_background = 0.0
zmax_background = 3.0
feedback = 0
; Keep the hacked thawing model inside CAMB itself.
use_tabulated_w = F
use_ppf_w = F
do_reionization = T
want_chistar = T
use_optical_depth = T

[camb_bg_sn]
file = boltzmann/camb/camb_interface.py
mode = background
nz_background = 500
zmin_background = 0.0
zmax_background = 3.0
feedback = 0
do_reionization = T
want_chistar = T
use_optical_depth = T
use_tabulated_w = F
use_ppf_w = F
save_derived = F
do_bao = F

[des_y6bao]
file = likelihood/des-y6-bao/bao_y6_like.py

[dovekie-sn]
file = likelihood/des-sn-dovekie/dovekie_sn_likelihood.py
data_file = %(CSL_DIR)s/likelihood/des-sn-dovekie/hubble_diagram.txt
covmat_file = %(CSL_DIR)s/likelihood/des-sn-dovekie/covtot_inv_000.npz
likelihood_only = T

[desi-dr2]
file = likelihood/bao/desi-dr2/desi_dr2.py
desi_data_sets = all
