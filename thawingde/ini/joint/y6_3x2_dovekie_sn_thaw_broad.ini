; DES Y6 3x2pt + Dovekie SN — broad prior on w0: U(-2, -0.33).
%include y6-3x2pt/inference/run_ini/main_32pt.ini
%include thawingde/ini/common/cluster_paths.ini
%include thawingde/ini/common/y6_3x2_aux_paths.ini

[DEFAULT]
RUN_NAME   = y6_3x2_dovekie_sn_thaw_broad
OUTPUT_DIR = %(THAWINGDE_DIR)s/chains/joint
2PT_FILE   = %(CSL_DIR)s/y6-3x2pt/inference/data_vectors/real/3x2pt_2025-07-28-20h_UNBLINDED_wmask_nob2.fits
2PT_DATA_SETS = xip xim gammat wtheta

%include thawingde/ini/common/runtime_output.ini
%include thawingde/ini/common/thaw_camb_power.ini
%include thawingde/ini/common/y6_3x2_scale_cuts.ini
%include thawingde/ini/common/external_likelihoods.ini

[pipeline]
modules = consistency bbn_consistency camb fast_pt fits_nz correlated_priors photoz_uz_lens photoz_uz_source IA pk_to_cl_gg pk_to_cl add_magnification add_intrinsic 2pt_shear 2pt_gal 2pt_gal_shear shear_m_bias add_point_mass 2pt_like dovekie-sn
priors  = %(THAWINGDE_DIR)s/ini/priors/y6_3x2_priors.ini
values  = %(THAWINGDE_DIR)s/ini/values/y6_3x2_dovekie_thaw_broad.ini
extra_output = COSMOLOGICAL_PARAMETERS/SIGMA_8 COSMOLOGICAL_PARAMETERS/S_8
failure_log = %(OUTPUT_DIR)s/failure_%(RUN_NAME)s.txt
timing = F
