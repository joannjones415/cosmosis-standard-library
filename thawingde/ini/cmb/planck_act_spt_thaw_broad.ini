; Planck 2018 + ACT DR6 lite + SPT-3G DR1 lite — broad prior on w0: U(-2, -0.33).
%include thawingde/ini/common/cluster_paths.ini

[DEFAULT]
RUN_NAME   = planck_act_spt_thaw_broad
OUTPUT_DIR = %(THAWINGDE_DIR)s/chains/cmb
PLANCK_PATH = %(CSL_DIR)s/likelihood/planck2018/baseline/plc_3.0

%include thawingde/ini/common/runtime_output.ini
%include thawingde/ini/common/consistency.ini
%include thawingde/ini/common/thaw_camb_cmb_act.ini
%include thawingde/ini/common/planck_act_spt_lite.ini

[pipeline]
modules = consistency bbn_consistency camb planck_highell planck_lowE act_dr6_lite spt_3g_dr1
values  = %(THAWINGDE_DIR)s/ini/values/planck_act_spt_thaw_broad.ini
priors  = %(THAWINGDE_DIR)s/ini/priors/cmb_planck_act_spt_priors.ini
extra_output = cosmological_parameters/h0 cosmological_parameters/omega_m
failure_log  = %(OUTPUT_DIR)s/failure_%(RUN_NAME)s.txt
timing = F
