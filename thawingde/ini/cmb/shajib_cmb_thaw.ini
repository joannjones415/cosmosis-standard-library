; Shajib & Frieman (2025) CMB run — Planck 2018 lite + ACT DR6 lite, NO SPT-3G.
; Direct reproduction of their CMB-only constraint.
; Compare to our planck_act_spt_thaw.ini which adds SPT-3G DR1 lite.
; CAMB settings: lmax=9000 (our standard; Shajib uses 4000 — difference is negligible).
%include thawingde/ini/common/cluster_paths.ini

[DEFAULT]
RUN_NAME    = shajib_cmb_thaw
OUTPUT_DIR  = %(THAWINGDE_DIR)s/chains/shajib
PLANCK_PATH = %(CSL_DIR)s/likelihood/planck2018/baseline/plc_3.0

%include thawingde/ini/common/runtime_output.ini
%include thawingde/ini/common/thaw_camb_cmb_act.ini
%include thawingde/ini/common/planck_act_lite.ini

[pipeline]
modules = consistency bbn_consistency camb planck_highell planck_lowE act_dr6_lite
values  = %(THAWINGDE_DIR)s/ini/values/shajib_cmb_thaw.ini
priors  = %(THAWINGDE_DIR)s/ini/priors/cmb_planck_act_priors.ini
extra_output = cosmological_parameters/h0 cosmological_parameters/omega_m
failure_log  = %(OUTPUT_DIR)s/failure_%(RUN_NAME)s.txt
timing = F
