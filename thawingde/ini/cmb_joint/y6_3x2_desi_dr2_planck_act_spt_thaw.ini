; ALL data: DES Y6 3x2pt + DESI DR2 BAO + Dovekie SN + Planck+ACT+SPT-3G — NEC prior on w0: U(-1, -0.33).
; Flagship "All" combination with full CMB (Planck+ACT+SPT) and DESI DR2 BAO ladder.
%include y6-3x2pt/inference/run_ini/main_32pt.ini
%include thawingde/ini/common/cluster_paths.ini
%include thawingde/ini/common/y6_3x2_aux_paths.ini

[DEFAULT]
RUN_NAME   = y6_3x2_desi_dr2_planck_act_spt_thaw
OUTPUT_DIR = %(THAWINGDE_DIR)s/chains/cmb_joint
2PT_FILE   = %(CSL_DIR)s/y6-3x2pt/inference/data_vectors/real/3x2pt_2025-07-28-20h_UNBLINDED_wmask_nob2.fits
2PT_DATA_SETS = xip xim gammat wtheta
PLANCK_PATH = %(CSL_DIR)s/likelihood/planck2018/baseline/plc_3.0

%include thawingde/ini/common/runtime_output.ini
%include thawingde/ini/common/thaw_camb_all.ini
%include thawingde/ini/common/y6_3x2_scale_cuts.ini
%include thawingde/ini/common/planck_act_spt_lite.ini
%include thawingde/ini/common/external_likelihoods.ini

[pipeline]
modules = consistency bbn_consistency camb fast_pt fits_nz correlated_priors photoz_uz_lens photoz_uz_source IA pk_to_cl_gg pk_to_cl add_magnification add_intrinsic 2pt_shear 2pt_gal 2pt_gal_shear shear_m_bias add_point_mass 2pt_like planck_highell planck_lowE act_dr6_lite spt_3g_dr1 desi-dr2 dovekie-sn
priors  = %(THAWINGDE_DIR)s/ini/priors/y6_3x2_priors.ini %(THAWINGDE_DIR)s/ini/priors/cmb_planck_act_spt_priors.ini
values  = %(THAWINGDE_DIR)s/ini/values/y6_3x2_planck_act_spt_thaw.ini
extra_output = COSMOLOGICAL_PARAMETERS/SIGMA_8 COSMOLOGICAL_PARAMETERS/S_8
failure_log = %(OUTPUT_DIR)s/failure_%(RUN_NAME)s.txt
timing = F
