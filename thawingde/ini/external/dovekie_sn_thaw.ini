%include thawingde/ini/common/cluster_paths.ini

[DEFAULT]
; Modern replacement for the paper's DES-SN5YR-only run:
; use Dovekie SN likelihood, but keep the paper's thawing-model background setup.
RUN_NAME = dovekie_sn_thaw
OUTPUT_DIR = %(THAWINGDE_DIR)s/chains/external

%include thawingde/ini/common/runtime_output.ini
%include thawingde/ini/common/external_likelihoods.ini

[pipeline]
; Module order follows y6-3x2pt/inference/run_ini/main_bao-sn.ini for external runs.
modules = consistency bbn_consistency camb_bg dovekie-sn
values = %(THAWINGDE_DIR)s/ini/values/external_dovekie_thaw.ini
extra_output = cosmological_parameters/h0 cosmological_parameters/omega_m cosmological_parameters/omega_b
failure_log = %(OUTPUT_DIR)s/failure_%(RUN_NAME)s.txt
timing = F
