%include thawingde/ini/common/cluster_paths.ini

[DEFAULT]
; DESI DR2 BAO + Dovekie SN — modern analogue of Shajib's "BAO+SN" row.
; Uses full DESI DR2 BAO ladder (z=0.3–2.3, 7 tracers) instead of DES Y6 single-z BAO.
; This is the fairest comparison to Shajib Table II row 4.
RUN_NAME = desi_dr2_dovekie_sn_thaw
OUTPUT_DIR = %(THAWINGDE_DIR)s/chains/external

%include thawingde/ini/common/runtime_output.ini
%include thawingde/ini/common/external_likelihoods.ini

[pipeline]
modules = consistency bbn_consistency camb_bg desi-dr2 dovekie-sn
values = %(THAWINGDE_DIR)s/ini/values/external_desi_dr2_dovekie_thaw.ini
extra_output = cosmological_parameters/h0 cosmological_parameters/omega_m cosmological_parameters/omega_b
failure_log = %(OUTPUT_DIR)s/failure_%(RUN_NAME)s.txt
timing = F
