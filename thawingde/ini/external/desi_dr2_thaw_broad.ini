%include thawingde/ini/common/cluster_paths.ini

[DEFAULT]
; DESI DR2 BAO-only run (individual). Full DESI DR2 BAO ladder (7 tracers, z=0.3-2.3).
; Broad prior on w0: U(-2, -0.33).
RUN_NAME = desi_dr2_thaw_broad
OUTPUT_DIR = %(THAWINGDE_DIR)s/chains/external

%include thawingde/ini/common/runtime_output.ini
%include thawingde/ini/common/external_likelihoods.ini

[pipeline]
modules = consistency bbn_consistency camb_bg desi-dr2
values = %(THAWINGDE_DIR)s/ini/values/external_desi_dr2_thaw_broad.ini
extra_output = cosmological_parameters/h0 cosmological_parameters/omega_m cosmological_parameters/omega_b
failure_log = %(OUTPUT_DIR)s/failure_%(RUN_NAME)s.txt
timing = F
