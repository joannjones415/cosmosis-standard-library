; Shajib & Frieman (2025) [arXiv:2502.06929] SN+BAO reproduction — thawing DE, NEC prior.
;
; Dataset: DES-SN5YR + MGS BAO + BOSS DR12 + DESI DR1 (z > 0.71)
; Priors:  Shajib Table I — h0 in U(0.55,0.91), Omega_m in U(0.10,0.90)
;
; Reference result: Shajib+2025 find w0 = -0.840 +0.048/-0.050 (NEC prior).
; Our run: DESI DR2 + Dovekie SN gives w0 = -0.865 +0.044/-0.042.
; This run allows direct "apples-to-apples" comparison on the same datasets.
%include thawingde/ini/common/cluster_paths.ini

[DEFAULT]
RUN_NAME   = shajib_sn_bao_thaw
OUTPUT_DIR = %(THAWINGDE_DIR)s/chains/shajib

%include thawingde/ini/common/runtime_output.ini
%include thawingde/ini/common/shajib_bao_sn_likelihoods.ini

[pipeline]
modules     = consistency bbn_consistency camb_bg mgs_bao boss_dr12 desi_dr1_hiz des_sn5yr
values      = %(THAWINGDE_DIR)s/ini/values/cosmology_shajib_thaw_nec.ini
extra_output = cosmological_parameters/h0 cosmological_parameters/omega_m
failure_log  = %(OUTPUT_DIR)s/failure_%(RUN_NAME)s.txt
timing = F
